services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riffats_app
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-riffat_secure_pass_2026}@db:5432/riffats_classroom?schema=public
      - DIRECT_URL=postgresql://postgres:${POSTGRES_PASSWORD:-riffat_secure_pass_2026}@db:5432/riffats_classroom?schema=public
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost}
      - AUTH_SECRET=${AUTH_SECRET:-riffats_classroom_production_secret_key_32_chars!}
      - STORAGE_DRIVER=local
      - CRON_SECRET=${CRON_SECRET:-riffats_cron_secret_2026}
      - NEXT_PUBLIC_DEFAULT_TIMEZONE=Asia/Dhaka
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - riffats_network
    expose:
      - "3000"

  db:
    image: postgres:16-alpine
    container_name: riffats_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riffat_secure_pass_2026}
      POSTGRES_DB: riffats_classroom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d riffats_classroom"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - riffats_network

  redis:
    image: redis:7-alpine
    container_name: riffats_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - riffats_network

  nginx:
    image: nginx:alpine
    container_name: riffats_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - riffats_network

volumes:
  postgres_data:
  redis_data:

networks:
  riffats_network:
    driver: bridge

